[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandaone-guard"
version = "0.7.14"
description = "AI Agent code audit gateway (Pandaone AI Agent) - OS-level mandatory review of every code change"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [
    {name = "Pandaone AI Agent Project", email = "pandaone@example.com"},
]
requires-python = ">=3.8"
keywords = ["audit", "ai", "agent", "code-review", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "watchdog>=3.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]
download = [
    "urllib3>=1.26",
]

[project.scripts]
pandaone = "pandaone.__main__:main"
pandaone-guard = "pandaone_guard:main"
pandaone-mcp = "pandaone_mcp:main"