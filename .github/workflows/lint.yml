# ============================================================
# .github/workflows/lint.yml — Pandaone AI Agent Lint & i18n CI
# ============================================================
#
# 第一性原理：
#   - 代码审查 + i18n 合规性是产品的护城河
#   - 不能因为开发者偷懒（hardcode 中文）让海外用户看到乱码
#   - 不能因为 PR 偷懒引入硬编码中文字符串
#   - 必须 fail-fast：发现违规立即报错，PR 不能合并
#
# 对抗式审查：
#   - audit_i18n.py 扫描所有 pandaone 包源码
#   - 检查 print() / raise / sys.stderr.write 中的硬编码中文
#   - 检查 i18n 模块的语言包覆盖率
#   - 失败时 exit 1，阻止 PR 合并
#
# 触发条件：
#   - 任何 push 到 main / develop
#   - 任何针对 main / develop 的 PR
#   - 手动触发 (workflow_dispatch)
#
# ============================================================

name: Lint & i18n

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 取消同分支的旧运行（节省 CI 资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # Job 1: i18n 审计（硬编码中文扫描）
  # ========================================
  i18n-audit:
    name: i18n Hardcoded Chinese Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pandaone (editable)
        run: |
          pip install -e .
        shell: bash

      - name: Run i18n audit (human-readable)
        run: |
          echo "================================================================"
          echo " Pandaone i18n 对抗式审查（CI 自动）"
          echo "================================================================"
          python scripts/audit_i18n.py
        shell: bash

      - name: Run i18n audit (JSON output for artifacts)
        run: |
          mkdir -p artifacts
          python scripts/audit_i18n.py --json > artifacts/i18n_audit.json
        shell: bash
        continue-on-error: true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i18n-audit-results
          path: artifacts/i18n_audit.json
          retention-days: 7

  # ========================================
  # Job 2: i18n 覆盖率（必须 ≥95%）
  # ========================================
  i18n-coverage:
    name: i18n Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: i18n-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pandaone (editable)
        run: |
          pip install -e .
        shell: bash

      - name: Check i18n coverage
        run: |
          python -c "
          from pandaone import i18n
          import sys
          report = i18n.coverage_report()
          failed = False
          for lang, stats in report.items():
              pct = 100 - stats['missing_pct']
              print(f'{lang}: {pct:.1f}% ({stats[\"present\"]}/{stats[\"total\"]})')
              if pct < 100:
                  print(f'  MISSING KEYS: {len(stats[\"missing\"])}')
                  for k in stats['missing'][:10]:
                      print(f'    - {k}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
        shell: bash

  # ========================================
  # Job 3: 测试（冒烟 + 完整套件 + 真实安装）
  # ========================================
  # 第一性原理（v0.7.18 重写——旧注释写的事实是错的）：
  #
  #   旧注释：「完整测试（3 OS × 3 Python = 9 矩阵）在 publish.yml 跑，gate 发布。」
  #   实际核对 publish.yml：**从来没有 9 矩阵**，只有一个 ubuntu + 3.10 单跑；
  #   而且 publish job 的 `needs` 是 `[build]` —— **测试失败并不阻止发布**。
  #
  #   于是"完整测试"在结构上一直是个装饰品：
  #     · PR 阶段只跑 3 个测试文件的冒烟 → 改坏 tests/ 下其余 40 个文件的 PR 照样合进 main
  #     · 发版时跑一次全量 → 挂了也不拦发布，只在日志里留一行红，发版照常继续
  #
  #   这与 v0.7.16（`.pandaone/` 半存在）、v0.7.17（editable 冒烟绕开打包路径）
  #   修的是**同一病根的第三次复发**：验证手段与真实使用场景脱节，且没人断言过
  #   「这个检查到底 gate 了什么」。
  #
  #   处置：把完整测试套件**前移**到 PR 阶段，并入本 job（规则集必需状态检查
  #   "Smoke Tests"），改坏任何一个测试的 PR 在合并前就被拦住。
  #   发版前 publish.yml 里那次运行降级为二次确认，并接上 needs 真正 gate 发布。
  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # v0.7.18: 5 → 15，本 job 现在含完整套件（约 75s）+ 真实安装

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --no-build-isolation
          pip install pytest pytest-timeout
        shell: bash

      - name: Smoke test (lint 流程只跑这个冒烟)
        run: |
          # 冒烟测试：只跑 lint 关心的几个文件，确认 Python 模块能 import、CLI 启动正常。
          # 完整测试矩阵在 publish.yml，避免 lint CI 因为环境差异长时间失败。
          set -o pipefail
          python -m pytest \
            tests/test_audit_i18n_ci.py \
            tests/test_i18n.py \
            tests/test_version_single_source.py \
            --tb=short -q --timeout=30 -p no:cacheprovider --no-header
        shell: bash

      - name: 完整测试套件（PR gate —— v0.7.18 前移自 publish.yml）
        # 背景：此前 377 个测试只在打 tag 发版时跑一次，而 publish job 的 needs 是
        #   [build] —— 测试挂了照样发版。PR 阶段只跑 3 个文件的冒烟，于是
        #   「改坏 tests/ 下 40 个文件里的任何一个」都能顺利合进 main，
        #   直到发版那一刻才（可能）被发现，而那时已经拦不住了。
        #
        # 这里把完整套件前移：弄坏测试的 PR 在**合并前**就被拦住。
        # 本地实测（editable 安装 / Python 3.11）：364 passed, 13 skipped，约 73s。
        #
        # 排除项是有据的，不是迷信（源自 commit 541d50c
        # "ci(pypi): pytest timeout 60s + exclude hang-prone watchdog/serve tests"）：
        #   tests/test_watchdog.py / tests/test_watchdog_dedupe.py
        #   用线程 + 时序断言，在共享 runner 上会偶发挂住，曾拖垮整个发版流程。
        #   它们仍由本地全量回归覆盖（本地跑 377P/13S/0F 全绿）。
        # 另：publish.yml 里还有一条 --ignore=tests/test_pandaone_serve.py，
        #     该文件早已改名为 test_pandax_serve.py —— 死参数，本版本一并清掉。
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --ignore=tests/test_watchdog.py \
            --ignore=tests/test_watchdog_dedupe.py \
            --timeout=60 --timeout-method=thread \
            -q --tb=short --no-header -p no:cacheprovider 2>&1 | tee /tmp/pytest-full.log
        shell: bash

      - name: 上传完整测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-full-log
          path: /tmp/pytest-full.log
          if-no-files-found: ignore

      - name: 真实安装冒烟（pip install . —— 防"装了跑不起来"复发）
        # v0.7.16 新增。
        #
        # 背景（第一英里断裂的完整复盘，见 CHANGELOG v0.7.15）：
        #   v0.7.14 的致命缺陷是"用户 pip install 之后 CLI 跑不起来"。
        #   而本 job 上面那一步用的是 **editable 安装**（pip install -e .），
        #   它直接从源码目录 import，**绕过了整个 wheel 打包路径**——
        #   package-data 漏配、入口点写错、子包没被打进 wheel，editable 全都不会暴露。
        #   也就是说：CI 全程绿的那一类"装了跑不起来"，editable 冒烟在结构上发现不了。
        #
        # 所以这里在独立 venv 里做一次**非 editable** 的真实安装，再跑 CLI：
        #   pip install . → pandaone --help → 版本与 pyproject 对齐
        # 这一步复现的就是真实用户的第一分钟。
        run: |
          set -e
          python -m venv /tmp/pandaone-install-smoke
          . /tmp/pandaone-install-smoke/bin/activate
          python -m pip install --upgrade pip
          pip install .

          echo "--- CLI 可执行性 ---"
          pandaone --help
          command -v pandaone-mcp >/dev/null || { echo "::error::pandaone-mcp 入口点未安装"; exit 1; }
          echo "pandaone-mcp 入口点: $(command -v pandaone-mcp)"

          echo "--- 版本一致性（装到的 == 声明的）---"
          python - <<'PY'
          import importlib.metadata as md, pathlib, re
          installed = md.version("pandaone-guard")
          declared = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          print(f"installed={installed} declared={declared}")
          if installed != declared:
              raise SystemExit(f"版本漂移: 装到的是 {installed}，pyproject 声明 {declared}")
          PY
        shell: bash

  # ========================================
  # Job 4: 整体汇总（PR 评论区输出）
  # ========================================
  summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [i18n-audit, i18n-coverage, test]
    if: always()

    steps:
      - name: All checks passed?
        run: |
          if [ "${{ needs.i18n-audit.result }}" != "success" ] || \
             [ "${{ needs.i18n-coverage.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "## :x: Lint & i18n Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "i18n-audit: ${{ needs.i18n-audit.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "i18n-coverage: ${{ needs.i18n-coverage.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "test: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## :white_check_mark: All Lint & i18n Checks Passed" >> "$GITHUB_STEP_SUMMARY"
        shell: bash