# ============================================================
# .github/workflows/lint.yml — Pandaone AI Agent Lint & i18n CI
# ============================================================
#
# 第一性原理：
#   - 代码审查 + i18n 合规性是产品的护城河
#   - 不能因为开发者偷懒（hardcode 中文）让海外用户看到乱码
#   - 不能因为 PR 偷懒引入硬编码中文字符串
#   - 必须 fail-fast：发现违规立即报错，PR 不能合并
#
# 对抗式审查：
#   - audit_i18n.py 扫描所有 pandaone 包源码
#   - 检查 print() / raise / sys.stderr.write 中的硬编码中文
#   - 检查 i18n 模块的语言包覆盖率
#   - 失败时 exit 1，阻止 PR 合并
#
# 触发条件：
#   - 任何 push 到 main / develop
#   - 任何针对 main / develop 的 PR
#   - 手动触发 (workflow_dispatch)
#
# ============================================================

name: Lint & i18n

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 取消同分支的旧运行（节省 CI 资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # Job 1: i18n 审计（硬编码中文扫描）
  # ========================================
  i18n-audit:
    name: i18n Hardcoded Chinese Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pandaone (editable)
        run: |
          pip install -e .
        shell: bash

      - name: Run i18n audit (human-readable)
        run: |
          echo "================================================================"
          echo " Pandaone i18n 对抗式审查（CI 自动）"
          echo "================================================================"
          python scripts/audit_i18n.py
        shell: bash

      - name: Run i18n audit (JSON output for artifacts)
        run: |
          mkdir -p artifacts
          python scripts/audit_i18n.py --json > artifacts/i18n_audit.json
        shell: bash
        continue-on-error: true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i18n-audit-results
          path: artifacts/i18n_audit.json
          retention-days: 7

  # ========================================
  # Job 2: i18n 覆盖率（必须 ≥95%）
  # ========================================
  i18n-coverage:
    name: i18n Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: i18n-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pandaone (editable)
        run: |
          pip install -e .
        shell: bash

      - name: Check i18n coverage
        run: |
          python -c "
          from pandaone import i18n
          import sys
          report = i18n.coverage_report()
          failed = False
          for lang, stats in report.items():
              pct = 100 - stats['missing_pct']
              print(f'{lang}: {pct:.1f}% ({stats[\"present\"]}/{stats[\"total\"]})')
              if pct < 100:
                  print(f'  MISSING KEYS: {len(stats[\"missing\"])}')
                  for k in stats['missing'][:10]:
                      print(f'    - {k}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
        shell: bash

  # ========================================
  # Job 3: 单元测试（仅冒烟测试，不在 lint 流程做完整测试矩阵）
  # ========================================
  # 第一性原理：
  #   lint 流程的本职是 i18n 合规审查 + 快速冒烟，不是完整测试矩阵。
  #   完整测试（3 OS × 3 Python = 9 矩阵）在 publish.yml 跑，gate 发布。
  #   lint 这里只跑一个 ubuntu + 3.11 的最小冒烟，快速反馈 i18n 之外没有
  #   把整个项目搞坏；如果只想跑特定测试，用 pytest --ignore 灵活配置。
  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --no-build-isolation
          pip install pytest pytest-timeout
        shell: bash

      - name: Smoke test (lint 流程只跑这个冒烟)
        run: |
          # 冒烟测试：只跑 lint 关心的几个文件，确认 Python 模块能 import、CLI 启动正常。
          # 完整测试矩阵在 publish.yml，避免 lint CI 因为环境差异长时间失败。
          set -o pipefail
          python -m pytest \
            tests/test_audit_i18n_ci.py \
            tests/test_i18n.py \
            tests/test_version_single_source.py \
            --tb=short -q --timeout=30 -p no:cacheprovider --no-header
        shell: bash

      - name: 真实安装冒烟（pip install . —— 防"装了跑不起来"复发）
        # v0.7.16 新增。
        #
        # 背景（第一英里断裂的完整复盘，见 CHANGELOG v0.7.15）：
        #   v0.7.14 的致命缺陷是"用户 pip install 之后 CLI 跑不起来"。
        #   而本 job 上面那一步用的是 **editable 安装**（pip install -e .），
        #   它直接从源码目录 import，**绕过了整个 wheel 打包路径**——
        #   package-data 漏配、入口点写错、子包没被打进 wheel，editable 全都不会暴露。
        #   也就是说：CI 全程绿的那一类"装了跑不起来"，editable 冒烟在结构上发现不了。
        #
        # 所以这里在独立 venv 里做一次**非 editable** 的真实安装，再跑 CLI：
        #   pip install . → pandaone --help → 版本与 pyproject 对齐
        # 这一步复现的就是真实用户的第一分钟。
        run: |
          set -e
          python -m venv /tmp/pandaone-install-smoke
          . /tmp/pandaone-install-smoke/bin/activate
          python -m pip install --upgrade pip
          pip install .

          echo "--- CLI 可执行性 ---"
          pandaone --help
          command -v pandaone-mcp >/dev/null || { echo "::error::pandaone-mcp 入口点未安装"; exit 1; }
          echo "pandaone-mcp 入口点: $(command -v pandaone-mcp)"

          echo "--- 版本一致性（装到的 == 声明的）---"
          python - <<'PY'
          import importlib.metadata as md, pathlib, re
          installed = md.version("pandaone-guard")
          declared = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          print(f"installed={installed} declared={declared}")
          if installed != declared:
              raise SystemExit(f"版本漂移: 装到的是 {installed}，pyproject 声明 {declared}")
          PY
        shell: bash

  # ========================================
  # Job 4: 整体汇总（PR 评论区输出）
  # ========================================
  summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [i18n-audit, i18n-coverage, test]
    if: always()

    steps:
      - name: All checks passed?
        run: |
          if [ "${{ needs.i18n-audit.result }}" != "success" ] || \
             [ "${{ needs.i18n-coverage.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "## :x: Lint & i18n Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "i18n-audit: ${{ needs.i18n-audit.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "i18n-coverage: ${{ needs.i18n-coverage.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "test: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## :white_check_mark: All Lint & i18n Checks Passed" >> "$GITHUB_STEP_SUMMARY"
        shell: bash