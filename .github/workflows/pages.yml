name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 允许 deployments + 防止 concurrent
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Add .nojekyll (绕过 Jekyll 处理)
        run: |
          touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# 启用方法：
# 1. Repo → Settings → Pages → Source: GitHub Actions
# 2. 之后每次 push 到 main 都会自动部署 docs/ 到 https://hellob1889.github.io/Pandaone AI Agent/
# 3. 首次部署需要创建名为 `github-pages` 的 Environment（自动）